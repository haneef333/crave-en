# Render Blueprint: creates the storefront API (free web service) and the
# storefront website (free static site) from this repo in one go.
# On render.com: New > Blueprint, pick this repo, then fill in the values
# marked "sync: false" when Render asks. Full walkthrough in README.md.
services:
  # ---------- Express + Socket.IO API ----------
  - type: web
    name: crave-en-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # MongoDB Atlas connection string, ending in /crave_en?...
      - key: CLIENT_URL
        sync: false # the website below, e.g. https://crave-en.onrender.com (no trailing slash)
      - key: PUBLIC_URL
        sync: false # this API's own URL, e.g. https://crave-en-api.onrender.com
      - key: INVENTORY_API_URL
        sync: false # your inventory backend on Render, e.g. https://smart-inventory-system-xxxx.onrender.com
      - key: INTEGRATION_SECRET
        sync: false # a long random string; put the exact same value in the inventory backend
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false # strongly recommended: Render's disk is wiped on every restart, so uploaded photos need Cloudinary
      - key: GOOGLE_CLIENT_ID
        sync: false # optional
      - key: SMTP_HOST
        sync: false # optional, e.g. smtp.gmail.com
      - key: SMTP_USER
        sync: false # optional
      - key: SMTP_PASS
        sync: false # optional (a Gmail app password)
      - key: DELIVERY_FEE
        value: "40"
      - key: TIMEZONE
        value: Asia/Kolkata

  # ---------- React website (always on, no spin-down) ----------
  - type: web
    name: crave-en
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false # the API above plus /api, e.g. https://crave-en-api.onrender.com/api
    routes:
      # Page refreshes on routes like /orders should still load the app
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Let new versions of the app reach phones that installed it
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
